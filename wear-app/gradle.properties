# This machine has ~8 GB RAM shared with the IDE, so keep the build light:
# Kotlin compiles inside the Gradle process instead of in a second long-lived daemon.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
